name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The packager reads tags to derive @project-version@, and a shallow
          # clone has none of them.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ffmpeg is the Vorbis encoder behind make_rain_audio.py. It is present on
      # the workstation and absent from the runner image, so without this the
      # release dies on a tag with a bare FileNotFoundError - and it dies AFTER
      # the point where a half-built ComfyRain/ already exists.
      - name: Install asset build dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet numpy Pillow

      # The .tga and .ogg files are gitignored: they are deterministic outputs
      # of these scripts, so the scripts are the source of truth and the
      # binaries stay out of git history. A package built straight from the
      # checkout therefore has no art and no audio.
      - name: Build the addon assets
        run: |
          python build/make_rain_tga.py   ComfyRain
          python build/make_snow_tga.py   ComfyRain
          python build/make_rain_audio.py ComfyRain
          python build/make_icon_tga.py   ComfyRain

      # This is not cosmetic and it is not optional.
      #
      # The packager skips any file git is ignoring, so building the assets is
      # NOT enough on its own: the first run of this workflow produced a zip
      # that installed perfectly and contained no rain and no sound. Force-add
      # makes them tracked in the throwaway CI checkout, which is the whole
      # mechanism by which they reach the archive.
      #
      # rain-v1..v5.ogg are deliberately not added. They are gain-staging
      # variants the build emits for comparison, not shipping assets.
      #
      # Re-pointing the tag is the other half of this step and is just as
      # load-bearing. The commit above moves HEAD one past the tag, so the
      # packager sees an untagged commit and behaves completely differently:
      # it names the zip ComfyRain-v1.0.0-1-gabc1234 instead of ComfyRain-v1.0.0,
      # and - the part that actually breaks the release - it treats the build
      # as an alpha and SKIPS publishing to GitHub entirely. The v1.0.0-rc1
      # rehearsal packaged a perfect zip, said "Packaging complete", and
      # created no release at all. The tag move is local to the runner and is
      # never pushed.
      - name: Make the generated assets visible to the packager
        run: |
          git add -f ComfyRain/*.tga ComfyRain/rain.ogg ComfyRain/thunder.ogg
          git -c user.email=ci@local -c user.name=ci commit -qm "ci: stage built assets"
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$tag" != "$GITHUB_REF" ]; then
            git tag -f "$tag" HEAD
            echo "TAG=$tag" >> "$GITHUB_ENV"
            echo "re-pointed $tag at the asset commit"
          else
            echo "not a tag build; the packager will produce an alpha"
          fi

      - name: Build the package
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -d
        env:
          # GITHUB_OAUTH, not GITHUB_TOKEN. See the publish step below.
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      # Check the ARTIFACT, not the working directory. The directory having the
      # files is what was true the last time this shipped empty - the assets
      # were all present on disk and every one of them was ignored on the way
      # into the zip. The only thing worth asserting is what a player unzips.
      - name: Verify the zip a player would download
        run: |
          zip=$(ls .release/*.zip | head -1)
          echo "checking $zip"
          unzip -o -q "$zip" -d /tmp/verify
          missing=0
          for f in ComfyRain.lua UI.lua ComfyRain.toc icon.tga \
                   rain-far.tga rain-near.tga \
                   snow-far.tga snow-near.tga snow-near-light.tga snow-gale.tga \
                   rain.ogg thunder.ogg; do
            if [ ! -s "/tmp/verify/ComfyRain/$f" ]; then
              echo "::error::$f is missing from the release zip"
              missing=1
            fi
          done
          # Probe.lua is a developer tool and must never reach a player.
          if [ -e /tmp/verify/ComfyRain/Probe.lua ]; then
            echo "::error::Probe.lua leaked into the release zip"
            missing=1
          fi
          # Named files in .pkgmeta are not enough: the ignore list is
          # hand-maintained and every new research note is a new chance to
          # forget it. v0.9.0-alpha shipped docs/ and dr-prompt-name-final.md,
          # 194KB of API dumps and an internal argument about what to call this
          # addon, into players' AddOns folders. This asserts the shape of the
          # zip instead of a list of filenames, so the next note that gets
          # added to the repo is caught without anyone remembering to.
          stray=$(find /tmp/verify/ComfyRain -name '*.md' \
                  ! -name README.md ! -name CHANGELOG.md)
          if [ -n "$stray" ]; then
            echo "::error::markdown that is not README or CHANGELOG is in the zip:"
            echo "$stray"
            missing=1
          fi
          if [ -d /tmp/verify/ComfyRain/docs ]; then
            echo "::error::docs/ leaked into the release zip"
            missing=1
          fi
          # An unsubstituted token here means the packager did not see a tag,
          # and the addon list would show a literal @project-version@.
          if grep -q '@project-version@' /tmp/verify/ComfyRain/ComfyRain.toc; then
            echo "::error::version token was not substituted"
            missing=1
          fi
          # And it must be substituted with the TAG, not with a git describe
          # string. `v1.0.0-1-gabc1234` in the addon list is the visible
          # symptom of the packager having lost the tag, and the invisible one
          # is that no GitHub release gets published.
          if [ -n "${TAG:-}" ]; then
            # A .toc is a Windows file and the packager writes CRLF, so the
            # line ends in \r and an exact match never fires. Strip it rather
            # than matching loosely, or this check passes on a prefix.
            got=$(grep '^## Version:' /tmp/verify/ComfyRain/ComfyRain.toc \
                  | head -1 | tr -d '\r' | sed 's/^## Version: *//')
            if [ "$got" != "$TAG" ]; then
              echo "::error::version is '${got}', expected the tag '${TAG}'"
              missing=1
            fi
            case "$zip" in
              *"ComfyRain-${TAG}-"*) ;;
              *) echo "::error::zip name does not carry the bare tag: $zip"; missing=1 ;;
            esac
          fi
          [ "$missing" -eq 0 ] || exit 1
          echo "zip contents:"
          unzip -l "$zip"

      - name: Publish the release
        uses: BigWigsMods/packager@v2.6.1
        env:
          # GITHUB_OAUTH. Not GITHUB_TOKEN, which release.sh never reads:
          #   [ -z "$github_token" ] && github_token=$GITHUB_OAUTH
          #   [ -z "$github_token" ] && github_token=$GITHUB_API_TOKEN
          # Those two names and a -w flag are the only ways in. With the wrong
          # name the packager builds the zip, prints "Packaging complete", and
          # returns 0 having uploaded nothing, because upload_github starts
          # with `[[ -z "$github_token" ]] && return 0`. Two rehearsal tags
          # went green and published nothing. The tell is in its own banner:
          # it prints "GitHub: owner/repo [token set]" when the token is
          # readable, and stops at the slug when it is not.
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # Unset until the CurseForge project exists. The packager skips the
          # CurseForge upload when it is absent and still publishes to GitHub,
          # so a tag pushed before the project is created still produces a
          # downloadable release rather than failing.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

      # The packager returns 0 whether or not it uploaded anything, so success
      # is not evidence that a release exists. Ask GitHub.
      - name: Confirm the release is actually on GitHub
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip=$(basename "$(ls .release/*.zip | head -1)")
          assets=$(gh release view "$TAG" --json assets -q '.assets[].name')
          echo "assets on $TAG:"; echo "$assets"
          echo "$assets" | grep -qx "$zip" || {
            echo "::error::$zip is not attached to release $TAG"
            exit 1
          }
