name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The addon targets the client's Lua 5.1. Running the suite on a newer
      # interpreter would accept syntax the client rejects, which is the one
      # thing a test suite for this project must not do.
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1

      - name: Syntax-check every chunk the client loads
        run: luac5.1 -p ComfyRain/*.lua

      - name: Run the spec suite
        run: cd test && lua5.1 run.lua

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy Pillow

      # make_rain_audio.py shells out to ffmpeg for the Vorbis encode. It is on
      # this workstation and it is NOT on the GitHub runner image, so the step
      # dies with a bare FileNotFoundError that says nothing about audio.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # The art is generated, so "does the build still produce it" is a real
      # test and the only one that catches a broken generator before a tag.
      - name: Build the assets and check they are non-empty
        run: |
          mkdir -p /tmp/assets
          python build/make_rain_tga.py   /tmp/assets
          python build/make_snow_tga.py   /tmp/assets
          python build/make_rain_audio.py /tmp/assets
          python build/make_icon_tga.py   /tmp/assets
          for f in rain-far.tga rain-near.tga snow-far.tga snow-near.tga \
                   snow-gale.tga rain.ogg thunder.ogg icon.tga; do
            [ -s "/tmp/assets/$f" ] || { echo "::error::$f not produced"; exit 1; }
          done
          ls -la /tmp/assets
