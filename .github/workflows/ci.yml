name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The addon targets the client's Lua 5.1. Running the suite on a newer
      # interpreter would accept syntax the client rejects, which is the one
      # thing a test suite for this project must not do.
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1

      - name: Syntax-check every chunk the client loads
        run: luac5.1 -p ComfyRain/*.lua

      - name: Run the spec suite
        run: cd test && lua5.1 run.lua

      # Every client API the addon calls was checked against the strings of
      # WowB.exe and written to test/api-manifest.txt. This step does not need
      # the client: it fails when the addon starts calling something that was
      # never on that list, which is the only way to catch "that API does not
      # exist on this build" while the beta client is withdrawn.
      - name: Check no unverified client API crept in
        run: python3 -I tools/api_audit.py --check

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy Pillow

      # make_rain_audio.py shells out to ffmpeg for the Vorbis encode. It is on
      # this workstation and it is NOT on the GitHub runner image, so the step
      # dies with a bare FileNotFoundError that says nothing about audio.
      # Lua 5.1 too: tools/perceive.py asks the addon what each setting draws
      # by running test/dump_scenes.lua.
      - name: Install ffmpeg and Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg lua5.1

      # The art is generated, so "does the build still produce it" is a real
      # test and the only one that catches a broken generator before a tag.
      - name: Build the assets and check they are non-empty
        run: |
          mkdir -p /tmp/assets
          python build/make_rain_tga.py   /tmp/assets
          python build/make_snow_tga.py   /tmp/assets
          python build/make_rain_audio.py /tmp/assets
          python build/make_icon_tga.py   /tmp/assets
          for f in rain-far.tga rain-near.tga rain-near-heavy.tga \
                   rain-near-monsoon.tga snow-far.tga snow-near.tga \
                   snow-near-light.tga snow-near-heavy.tga snow-gale.tga \
                   rain.ogg thunder.ogg icon.tga; do
            [ -s "/tmp/assets/$f" ] || { echo "::error::$f not produced"; exit 1; }
          done
          ls -la /tmp/assets

      # Non-empty is not the same as loadable, let alone good. This checks the
      # TGAs the step above just wrote: the format WoW silently refuses to
      # draw, the seam that repeats across the screen, and the on-screen size
      # of the largest element at every preset.
      - name: Check the art assets
        run: python build/check_art.py /tmp/assets

      # Every choice in the window, rendered with this art and judged the way a
      # player would: two settings that land on the same picture and the same
      # sound fail. The spec suite cannot catch that, because it checks the
      # numbers sent to the renderer, and light snow sent different numbers for
      # weeks while drawing what normal drew.
      - name: Check every setting looks or sounds different
        run: LUA=lua5.1 python tools/perceive.py /tmp/assets
